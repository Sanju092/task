name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required for AGP 8.x + Kotlin 1.9)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Grant execute permission to gradlew
      - name: Grant Gradlew permissions
        run: chmod +x YearPlanner/gradlew

      # 4. Cache Gradle dependencies to speed up builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: YearPlanner

      # 6. Upload APK as a downloadable artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YearPlanner-debug-${{ github.run_number }}
          path: YearPlanner/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. Run unit tests
      - name: Run Unit Tests
        run: ./gradlew test --stacktrace
        working-directory: YearPlanner

      # 8. Upload test results
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: YearPlanner/app/build/reports/tests/
          retention-days: 7

